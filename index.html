<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <style>html{background:#fff}html[data-theme="dark"]{background:#1b2027}</style>
    <script>
      // Resolve before first paint so a dark-system launch never flashes white.
      (() => {
        let saved
        try { saved = localStorage.getItem('msweeper-theme') } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#1b2027' : '#ffffff')
      })()
    </script>
    <meta name="description" content="Un buscaminas infinito. Tocá, descubrí y explorá sin límites. Hecho para jugar en el celular." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mines ∞ — Buscaminas infinito</title>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
